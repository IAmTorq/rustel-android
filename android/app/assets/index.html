<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self';style-src 'self' 'unsafe-inline';font-src 'self';img-src 'self' data:"><link rel="stylesheet" href="xterm.css"><style>
:root{--phone-background:#0f0f1c;--phone-surface:#25253a;--phone-overlay:#18182b;--phone-foreground:#e0e3f9;--phone-muted:#bdbbd3;--phone-rule:#41415d;--phone-accent:#00d7d7;--phone-selection:#655284;--phone-selectionText:#ffffff;--phone-warn:#ffff00;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--phone-background);color:var(--phone-foreground);font-family:monospace}body{display:flex;flex-direction:column}button{font:12px monospace;color:var(--phone-foreground);background:var(--phone-surface);border:1px solid var(--phone-rule);border-radius:0;padding:8px 5px;white-space:nowrap;touch-action:manipulation}button.on{background:var(--phone-selection);color:var(--phone-selectionText);border-color:var(--phone-accent)}button.locked{background:var(--phone-accent);color:var(--phone-background);border-color:var(--phone-warn)}#tools,.keyrow{display:flex;gap:3px;padding:4px;flex:none}#tools{border-bottom:1px solid var(--phone-rule)}#tools button,.keyrow button{flex:1}#term{flex:1;min-height:0;min-width:0;padding:3px;overflow:auto}#nav{flex:none;display:flex;gap:8px;padding:4px}#modkeys{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,36px);gap:3px}#modkeys #more{grid-column:2 / span 2}#arrows{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,36px);gap:3px}#arrows [data-key="ArrowUp"]{grid-column:2;grid-row:1}#arrows [data-key="ArrowLeft"]{grid-column:1;grid-row:1 / span 2}#arrows [data-key="ArrowDown"]{grid-column:2;grid-row:2}#arrows [data-key="ArrowRight"]{grid-column:3;grid-row:1 / span 2}.xterm-viewport::-webkit-scrollbar{display:none}.xterm .xterm-scrollable-element>.scrollbar{display:none!important}
#drawer{position:fixed;z-index:20;left:8px;right:8px;bottom:8px;max-height:72%;background:var(--phone-overlay);border:1px solid var(--phone-rule);border-radius:0;box-shadow:none;display:flex;flex-direction:column;padding:8px}#drawer[hidden]{display:none}#drawer header{display:flex;gap:4px;flex:none}#drawer header button{flex:1}#drawer section{overflow:auto;padding-top:8px}#drawer section[hidden]{display:none}#action-search{width:100%;padding:9px;background:var(--phone-background);color:var(--phone-foreground);border:1px solid var(--phone-rule);border-radius:0;font:14px monospace}#action-list{display:grid;gap:5px;margin-top:8px}#action-list button{text-align:left;padding:11px}#symbols,#function-keys,#extra-keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:8px}#symbols button{font:18px monospace;min-height:40px}#key-help{font:12px monospace;color:var(--phone-muted);line-height:1.4;margin:8px 0}
button:focus-visible,#action-search:focus-visible{outline:1px solid var(--phone-accent);outline-offset:1px}button:active{background:var(--phone-selection);color:var(--phone-selectionText)}</style></head><body>
<div id="tools"><button data-action="update">Play</button><button data-action="stop">Stop</button><button data-action="menu-bar">Menu</button><button id="actions">Actions</button><button id="settings">Settings</button></div>
<div id="term"></div>
<div id="nav"><div id="modkeys"><button id="ctrl" data-mod="4">Ctrl</button><button id="alt" data-mod="2">Alt</button><button data-key="Escape">Esc</button><button data-key="Tab">Tab</button><button id="more">More keys</button></div><div id="arrows" aria-label="Arrow keys"><button data-key="ArrowLeft">←</button><button data-key="ArrowUp">↑</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button></div></div>
<aside id="drawer" hidden aria-label="Phone controls"><header><button data-tab="actions">Actions</button><button data-tab="symbols">Symbols</button><button data-tab="keys">Keys</button><button id="close-drawer">Close</button></header><section id="actions-panel"><input id="action-search" type="search" placeholder="Find an action" autocomplete="off"><button id="flip-camera" style="width:100%;margin-top:8px;text-align:left;padding:11px">Switch to rear camera</button><div id="action-list"></div></section><section id="symbols-panel" hidden><div id="symbols"></div></section><section id="keys-panel" hidden><p id="key-help">Use the Android keyboard or a physical keyboard. A hardware Fn-to-Ctrl mapping works when configured on the phone. Physical Alt keeps its Android symbol layer. Touch modifiers: tap for the next key, or hold to lock. The touch Alt button sends Rustel's Alt shortcuts.</p><div id="function-keys"></div><div id="extra-keys"></div><button id="keyboard">Show/hide screen keyboard</button><button id="paste">Paste clipboard</button></section></aside>
<script src="xterm.js"></script><script src="addon-webgl.js"></script><script src="renderer-cache.js"></script><script src="reference-touch.js"></script><script src="phone-controls.js"></script><script src="phone-theme.js"></script>
</body></html>
