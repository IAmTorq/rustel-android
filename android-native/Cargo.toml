[package]
name = "rustel-android"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
[lib]
name = "rustel_android"
crate-type = ["cdylib"]
[features]
qa = ["dep:sha2", "dep:rustel-fraction"]
[target.'cfg(target_os = "android")'.dependencies]
sha2 = { version = "0.10", optional = true }
rustel-fraction = { path = "../crates/fraction", optional = true }
rustel-audio = { path = "../crates/audio", default-features = false }
rustel-studio = { path = "../crates/studio", default-features = false, features = ["extensions", "hydra", "video", "osc", "remote-control", "themes"] }
rustel-runtime = { path = "../crates/runtime", default-features = false, features = ["device-audio", "midi", "session-log", "mp3-export", "extensions", "opus", "osc", "hydra", "video"] }
jni = "0.21"
ndk-context = "0.1"
libc = "0.2"
serde_json = "1"
rquickjs-sys = { git = "https://github.com/tzfm/rquickjs", rev = "ed2337c6f187996ef97f7e4e44458cfbc33266f4", features = ["bindgen"] }
